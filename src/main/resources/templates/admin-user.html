<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Manage Users</h2>
    <div>
        <a th:href="@{/admin/create-user}" class="btn btn-success me-2">Add User</a>
        <a th:href="@{/}" class="btn btn-dark">Home</a>
    </div>
</div>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Manage Users</h2>
        <div>
            <a th:href="@{/}" class="btn btn-dark">Home</a>
        </div>
    </div>

    <div class="card shadow">
        <div class="card-body">
            <table class="table table-bordered table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Email</th>
                        <th>Username</th>
                        <th>Role</th>
                        <th>Enabled</th>
                        <th>Update Role</th>
                        <th>Status</th>
                        <th>Delete</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="10" class="text-center">No users found</td>
                    </tr>

                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}"></td>
                        <td th:text="${user.firstName}"></td>
                        <td th:text="${user.lastName}"></td>
                        <td th:text="${user.email}"></td>
                        <td th:text="${user.username}"></td>
                        <td th:text="${user.role}"></td>
                        <td th:text="${user.enabled} ? 'Yes' : 'No'"></td>

                        <td>
                            <form th:action="@{/admin/update-role}" method="post" class="d-flex gap-2">
                                <input type="hidden" name="id" th:value="${user.id}">
                                <select name="role" class="form-select form-select-sm">
                                    <option value="ADMIN" th:selected="${user.role.name() == 'ADMIN'}">ADMIN</option>
                                    <option value="ORGANIZER" th:selected="${user.role.name() == 'ORGANIZER'}">ORGANIZER</option>
                                    <option value="USER" th:selected="${user.role.name() == 'USER'}">USER</option>
                                </select>
                                <button type="submit" class="btn btn-primary btn-sm">Save</button>
                            </form>
                        </td>

                        <td>
                            <form th:action="@{/admin/toggle-status}" method="post">
                                <input type="hidden" name="id" th:value="${user.id}">
                                <button type="submit"
                                        class="btn btn-sm"
                                        th:classappend="${user.enabled} ? ' btn-warning' : ' btn-success'"
                                        th:text="${user.enabled} ? 'Disable' : 'Enable'">
                                </button>
                            </form>
                        </td>

                        <td>
                            <form th:action="@{/admin/delete-user}" method="post"
                                  onsubmit="return confirm('Are you sure you want to delete this user?');">
                                <input type="hidden" name="id" th:value="${user.id}">
                                <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
