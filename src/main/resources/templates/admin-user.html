<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; color: #171a20; }
        .navbar { position: fixed; top: 0; width: 100%; z-index: 100; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); padding: 14px 0; }
        .navbar-brand { font-weight: 800; font-size: 1.2rem; color: #fff !important; letter-spacing: 2px; text-transform: uppercase; text-decoration: none; }
        .nav-link-custom { color: rgba(255,255,255,0.85); font-size: 0.82rem; font-weight: 500; text-decoration: none; padding: 6px 12px; border-radius: 6px; transition: background 0.2s; }
        .nav-link-custom:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .btn-nav { font-size: 0.82rem; font-weight: 600; border-radius: 6px; padding: 7px 18px; }
        .page-header { padding: 120px 0 48px; background: #171a20; color: #fff; }
        .page-header h1 { font-size: 2.8rem; font-weight: 800; letter-spacing: -1px; }
        .page-header p { color: rgba(255,255,255,0.6); font-size: 1rem; margin-top: 8px; }
        .btn-add { background: #fff; color: #171a20; font-weight: 700; border-radius: 8px; padding: 10px 22px; font-size: 0.875rem; border: none; text-decoration: none; }
        .btn-add:hover { background: #e8e8e8; color: #171a20; }
        .table-wrap { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); overflow: hidden; }
        .admin-table thead tr { background: #171a20; color: #fff; }
        .admin-table thead th { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; padding: 16px 16px; border: none; }
        .admin-table tbody tr { border-bottom: 1px solid #f0f0f0; transition: background 0.15s; }
        .admin-table tbody tr:hover { background: #f9f9f9; }
        .admin-table tbody td { font-size: 0.875rem; padding: 14px 16px; border: none; vertical-align: middle; }
        .badge-role { font-size: 0.7rem; font-weight: 700; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge-admin { background: #fdecea; color: #c0392b; }
        .badge-organizer { background: #e6f4ea; color: #1a7a3c; }
        .badge-user { background: #f0f2f5; color: #65676b; }
        .badge-enabled { background: #e6f4ea; color: #1a7a3c; font-size: 0.7rem; font-weight: 700; padding: 4px 10px; border-radius: 20px; }
        .badge-disabled { background: #fdecea; color: #c0392b; font-size: 0.7rem; font-weight: 700; padding: 4px 10px; border-radius: 20px; }
        .form-select-sm { border-radius: 6px; font-size: 0.8rem; border: 1px solid #e4e6ea; }
        .btn-save { background: #171a20; color: #fff; font-size: 0.78rem; font-weight: 700; border-radius: 6px; padding: 6px 14px; border: none; }
        .btn-save:hover { background: #333; color: #fff; }
        .btn-toggle-disable { background: #fff3cd; color: #856404; font-size: 0.78rem; font-weight: 700; border-radius: 6px; padding: 6px 14px; border: 1px solid #ffc107; }
        .btn-toggle-enable { background: #e6f4ea; color: #1a7a3c; font-size: 0.78rem; font-weight: 700; border-radius: 6px; padding: 6px 14px; border: 1px solid #28a745; }
        .btn-delete { background: #fdecea; color: #c0392b; font-size: 0.78rem; font-weight: 700; border-radius: 6px; padding: 6px 14px; border: 1px solid #e74c3c; }
        .btn-delete:hover { background: #e74c3c; color: #fff; }
        .btn-back { background: transparent; color: #65676b; font-size: 0.85rem; font-weight: 600; border: 1px solid #e4e6ea; border-radius: 8px; padding: 8px 18px; text-decoration: none; }
        .btn-back:hover { background: #f0f0f0; color: #171a20; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="container d-flex align-items-center justify-content-between">
        <a class="navbar-brand" th:href="@{/}">EventBook</a>
        <div class="d-flex align-items-center gap-1">
            <a class="nav-link-custom" th:href="@{/events}">Events</a>
            <a class="nav-link-custom" th:href="@{/about}">About</a>
            <a class="nav-link-custom" th:href="@{/contact}">Contact</a>
            <a class="nav-link-custom" th:href="@{/admin}">Admin</a>
            <a class="nav-link-custom" th:href="@{/events/new}">+ New Event</a>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-nav ms-2" style="background:rgba(255,255,255,0.15);color:#fff;border:1px solid rgba(255,255,255,0.3);">Log Out</button>
            </form>
        </div>
    </div>
</nav>

<div class="page-header">
    <div class="container d-flex justify-content-between align-items-end">
        <div>
            <h1>Manage Users</h1>
            <p>View, update roles, enable or disable, and delete user accounts.</p>
        </div>
        <a th:href="@{/admin/create-user}" class="btn-add">+ Add User</a>
    </div>
</div>

<div class="container py-5">
    <div class="table-wrap">
        <table class="table admin-table mb-0">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Email</th>
                    <th>Username</th>
                    <th>Role</th>
                    <th>Enabled</th>
                    <th>Update Role</th>
                    <th>Status</th>
                    <th>Delete</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(users)}">
                    <td colspan="10" class="text-center py-5" style="color:#65676b;">No users found.</td>
                </tr>
                <tr th:each="user : ${users}">
                    <td style="color:#65676b;" th:text="${user.id}"></td>
                    <td style="font-weight:600;" th:text="${user.firstName}"></td>
                    <td th:text="${user.lastName}"></td>
                    <td style="color:#65676b;" th:text="${user.email}"></td>
                    <td th:text="${user.username}"></td>
                    <td>
                        <span class="badge-role"
                              th:classappend="${user.role.name() == 'ADMIN'} ? ' badge-admin' : (${user.role.name() == 'ORGANIZER'} ? ' badge-organizer' : ' badge-user')"
                              th:text="${user.role}"></span>
                    </td>
                    <td>
                        <span th:if="${user.enabled}" class="badge-enabled">Yes</span>
                        <span th:unless="${user.enabled}" class="badge-disabled">No</span>
                    </td>
                    <td>
                        <form th:action="@{/admin/update-role}" method="post" class="d-flex gap-2">
                            <input type="hidden" name="id" th:value="${user.id}">
                            <select name="role" class="form-select form-select-sm">
                                <option value="ADMIN" th:selected="${user.role.name() == 'ADMIN'}">ADMIN</option>
                                <option value="ORGANIZER" th:selected="${user.role.name() == 'ORGANIZER'}">ORGANIZER</option>
                                <option value="USER" th:selected="${user.role.name() == 'USER'}">USER</option>
                            </select>
                            <button type="submit" class="btn-save">Save</button>
                        </form>
                    </td>
                    <td>
                        <form th:action="@{/admin/toggle-status}" method="post">
                            <input type="hidden" name="id" th:value="${user.id}">
                            <button type="submit"
                                    th:class="${user.enabled} ? 'btn-toggle-disable' : 'btn-toggle-enable'"
                                    th:text="${user.enabled} ? 'Disable' : 'Enable'">
                            </button>
                        </form>
                    </td>
                    <td>
                        <form th:action="@{/admin/delete-user}" method="post"
                              onsubmit="return confirm('Are you sure you want to delete this user?');">
                            <input type="hidden" name="id" th:value="${user.id}">
                            <button type="submit" class="btn-delete">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="mt-4">
        <a class="btn-back" th:href="@{/}">Back Home</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
