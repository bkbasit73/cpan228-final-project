<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Events</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; color: #171a20; }
        .navbar { position: fixed; top: 0; width: 100%; z-index: 100; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); padding: 14px 0; }
        .navbar-brand { font-weight: 800; font-size: 1.2rem; color: #fff !important; letter-spacing: 2px; text-transform: uppercase; }
        .nav-link-custom { color: rgba(255,255,255,0.85) !important; font-size: 0.82rem; font-weight: 500; text-decoration: none; padding: 6px 12px; border-radius: 6px; transition: background 0.2s; }
        .nav-link-custom:hover { background: rgba(255,255,255,0.1); color: #fff !important; }
        .btn-nav { font-size: 0.82rem; font-weight: 600; border-radius: 6px; padding: 7px 18px; }
        .page-header { padding: 120px 0 48px; background: #171a20; color: #fff; }
        .page-header h1 { font-size: 2.8rem; font-weight: 800; letter-spacing: -1px; }
        .page-header p { color: rgba(255,255,255,0.6); font-size: 1rem; margin-top: 8px; }
        .filter-bar { background: #fff; border-bottom: 1px solid #e4e6ea; padding: 20px 0; position: sticky; top: 56px; z-index: 90; }
        .filter-bar .form-select { border-radius: 8px; font-size: 0.875rem; border: 1px solid #e4e6ea; padding: 10px 14px; }
        .btn-apply { background: #171a20; color: #fff; font-weight: 700; border-radius: 8px; padding: 10px 24px; font-size: 0.875rem; border: none; }
        .btn-apply:hover { background: #333; color: #fff; }
        .events-table-wrap { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); overflow: hidden; }
        .events-table thead tr { background: #171a20; color: #fff; }
        .events-table thead th { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; padding: 16px 20px; border: none; }
        .events-table tbody tr { border-bottom: 1px solid #f0f0f0; transition: background 0.15s; }
        .events-table tbody tr:hover { background: #f9f9f9; }
        .events-table tbody td { font-size: 0.9rem; padding: 16px 20px; border: none; color: #1c1e21; vertical-align: middle; }
        .badge-type { font-size: 0.72rem; font-weight: 700; padding: 4px 10px; border-radius: 20px; background: #f0f0f0; color: #171a20; text-transform: uppercase; letter-spacing: 0.5px; }
        .btn-add { background: #171a20; color: #fff; font-weight: 700; border-radius: 8px; padding: 10px 22px; font-size: 0.875rem; border: none; text-decoration: none; }
        .btn-add:hover { background: #333; color: #fff; }
        .btn-back { background: transparent; color: #65676b; font-size: 0.85rem; font-weight: 600; border: 1px solid #e4e6ea; border-radius: 8px; padding: 8px 18px; text-decoration: none; }
        .btn-back:hover { background: #f0f0f0; color: #171a20; }
        .empty-state { padding: 60px 20px; text-align: center; color: #65676b; font-size: 0.95rem; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="container d-flex align-items-center justify-content-between">
        <a class="navbar-brand" th:href="@{/}">EventBook</a>
        <div class="d-flex align-items-center gap-1">
            <a class="nav-link-custom" th:href="@{/events}">Events</a>
            <a class="nav-link-custom" th:href="@{/about}">About</a>
            <a class="nav-link-custom" th:href="@{/contact}">Contact</a>
            <a class="nav-link-custom" th:href="@{/admin}" sec:authorize="hasRole('ADMIN')">Admin</a>
            <a class="nav-link-custom" th:href="@{/events/new}" sec:authorize="hasAnyRole('ADMIN','ORGANIZER')">+ New Event</a>
            <a class="btn btn-nav btn-light ms-2" th:href="@{/login}" sec:authorize="!isAuthenticated()">Log In</a>
            <form th:action="@{/logout}" method="post" style="display:inline;" sec:authorize="isAuthenticated()">
                <button type="submit" class="btn btn-nav" style="background:rgba(255,255,255,0.15);color:#fff;border:1px solid rgba(255,255,255,0.3);">Log Out</button>
            </form>
        </div>
    </div>
</nav>

<div class="page-header">
    <div class="container d-flex justify-content-between align-items-end">
        <div>
            <h1>Events</h1>
            <p>Browse, filter, and sort all upcoming events.</p>
        </div>
        <a class="btn-add" th:href="@{/events/new}" sec:authorize="hasAnyRole('ADMIN','ORGANIZER')">+ Add Event</a>
    </div>
</div>

<div class="filter-bar">
    <div class="container">
        <form class="row g-2 align-items-center" th:action="@{/events}" method="get">
            <div class="col-md-4">
                <select class="form-select" name="type">
                    <option value="">All Types</option>
                    <option th:each="t : ${types}" th:value="${t}" th:text="${t}" th:selected="${selectedType} == ${t}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <select class="form-select" name="sort">
                    <option value="eventDate" th:selected="${selectedSort}=='eventDate'">Sort by Date</option>
                    <option value="capacity" th:selected="${selectedSort}=='capacity'">Sort by Capacity</option>
                    <option value="price" th:selected="${selectedSort}=='price'">Sort by Price</option>
                </select>
            </div>
            <div class="col-md-3">
                <select class="form-select" name="dir">
                    <option value="asc" th:selected="${selectedDir}=='asc'">Ascending</option>
                    <option value="desc" th:selected="${selectedDir}=='desc'">Descending</option>
                </select>
            </div>
            <div class="col-md-2">
                <button class="btn-apply w-100" type="submit">Apply</button>
            </div>
        </form>
    </div>
</div>

<div class="container py-5">
    <div class="events-table-wrap">
        <table class="table events-table mb-0">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Type</th>
                    <th>Location</th>
                    <th>Date</th>
                    <th>Capacity</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(events)}">
                    <td colspan="6" class="empty-state">No events found.</td>
                </tr>
                <tr th:each="e : ${events}">
                    <td style="font-weight:600;" th:text="${e.name}"></td>
                    <td><span class="badge-type" th:text="${e.type}"></span></td>
                    <td th:text="${e.location}"></td>
                    <td th:text="${e.eventDate}"></td>
                    <td th:text="${e.capacity}"></td>
                    <td th:text="'$' + ${e.price}"></td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="mt-4">
        <a class="btn-back" th:href="@{/}">Back Home</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
