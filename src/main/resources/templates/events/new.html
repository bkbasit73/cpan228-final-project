<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Create Event</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; color: #171a20; }
        .navbar { position: fixed; top: 0; width: 100%; z-index: 100; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); padding: 14px 0; }
        .navbar-brand { font-weight: 800; font-size: 1.2rem; color: #fff !important; letter-spacing: 2px; text-transform: uppercase; text-decoration: none; }
        .nav-link-custom { color: rgba(255,255,255,0.85); font-size: 0.82rem; font-weight: 500; text-decoration: none; padding: 6px 12px; border-radius: 6px; transition: background 0.2s; }
        .nav-link-custom:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .btn-nav { font-size: 0.82rem; font-weight: 600; border-radius: 6px; padding: 7px 18px; }
        .page-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 100px 16px 60px; }
        .form-card { background: #fff; border-radius: 16px; box-shadow: 0 2px 16px rgba(0,0,0,0.08); padding: 48px 40px; width: 100%; max-width: 520px; }
        .form-card h2 { font-size: 1.6rem; font-weight: 800; margin-bottom: 6px; }
        .form-card p { font-size: 0.875rem; color: #65676b; margin-bottom: 32px; }
        .form-label { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #65676b; margin-bottom: 6px; }
        .form-control, .form-select { border-radius: 8px; border: 1px solid #e4e6ea; font-size: 0.9rem; padding: 12px 14px; background: #fff; }
        .form-control:focus, .form-select:focus { border-color: #171a20; box-shadow: none; }
        .btn-save { background: #171a20; color: #fff; font-weight: 700; border-radius: 8px; padding: 12px 32px; font-size: 0.9rem; border: none; width: 100%; transition: background 0.2s; }
        .btn-save:hover { background: #333; color: #fff; }
        .btn-cancel { display: block; text-align: center; margin-top: 14px; font-size: 0.85rem; color: #65676b; font-weight: 600; text-decoration: none; }
        .btn-cancel:hover { color: #171a20; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="container d-flex align-items-center justify-content-between">
        <a class="navbar-brand" th:href="@{/}">EventBook</a>
        <div class="d-flex align-items-center gap-1">
            <a class="nav-link-custom" th:href="@{/events}">Events</a>
            <a class="nav-link-custom" th:href="@{/about}">About</a>
            <a class="nav-link-custom" th:href="@{/contact}">Contact</a>
            <a class="nav-link-custom" th:href="@{/admin}" sec:authorize="hasRole('ADMIN')">Admin</a>
            <a class="nav-link-custom" th:href="@{/events/new}" sec:authorize="hasAnyRole('ADMIN','ORGANIZER')">+ New Event</a>
            <a class="btn btn-nav btn-light ms-2" th:href="@{/login}" sec:authorize="!isAuthenticated()">Log In</a>
            <form th:action="@{/logout}" method="post" style="display:inline;" sec:authorize="isAuthenticated()">
                <button type="submit" class="btn btn-nav ms-2" style="background:rgba(255,255,255,0.15);color:#fff;border:1px solid rgba(255,255,255,0.3);">Log Out</button>
            </form>
        </div>
    </div>
</nav>

<div class="page-wrap">
    <div class="form-card">
        <h2>Create Event</h2>
        <p>Fill in the details below to add a new event.</p>
        <form th:action="@{/events}" th:object="${event}" method="post">
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input class="form-control" type="text" th:field="*{name}">
            </div>
            <div class="mb-3">
                <label class="form-label">Type</label>
                <select class="form-select" th:field="*{type}">
                    <option value="">Select Type</option>
                    <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Location</label>
                <input class="form-control" type="text" th:field="*{location}">
            </div>
            <div class="mb-3">
                <label class="form-label">Date</label>
                <input class="form-control" type="date" th:field="*{eventDate}">
            </div>
            <div class="mb-3">
                <label class="form-label">Capacity</label>
                <input class="form-control" type="number" th:field="*{capacity}">
            </div>
            <div class="mb-4">
                <label class="form-label">Price</label>
                <input class="form-control" type="number" step="0.01" th:field="*{price}">
            </div>
            <button class="btn-save" type="submit">Save Event</button>
            <a class="btn-cancel" th:href="@{/events}">Cancel</a>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
